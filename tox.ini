[tox]
isolated_build = true
envlist =
    py3{11,10,9}
    style
    typing
    docs
skip_missing_interpreters = true
isolated_build = true

[testenv]
groups = tests
allowlist_externals = uv
deps =
    lowest: flask==2.2
    lowest: sqlalchemy==1.4.18
commands =
    uv sync --python {envpython}
    uv pip install -e .[tests]
    uv run python -m pytest -v --tb=short --doctest-modules tests --basetemp={envtmpdir} {posargs}
